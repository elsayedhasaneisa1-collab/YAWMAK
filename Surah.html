<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f4ec"><meta name="description" content="اقرأ واستمع إلى القرآن الكريم مع التفسير والمفضلة."><title>القرآن الكريم | يومك</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4ec;--card:#fffef9;--ink:#263c30;--muted:#7c8878;--green:#28563f;--mint:#e8eedf;--line:#e5e7dc;--gold:#b99a5b;--shadow:0 12px 35px #304b3210}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Arial,sans-serif}.wrap{width:min(100% - 30px,980px);margin:auto;padding:22px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-weight:800;color:var(--green);font-size:20px}.btn{border:1px solid var(--line);background:var(--card);color:var(--green);border-radius:12px;padding:10px 14px;font:600 13px Cairo;cursor:pointer}.hero{background:linear-gradient(135deg,#214e3e,#42694e);color:#f6f5e9;border-radius:22px;padding:25px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 25px,#ffffff0a 26px 27px);pointer-events:none}.hero>*{position:relative}.hero small{color:#d9dfc8}.hero h1{font:400 40px 'Amiri Quran',serif;margin:8px 0}.meta{font-size:12px;color:#d9dfc8}.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:17px}.tools .btn{background:#ffffff16;border-color:#ffffff35;color:white}.player{margin:16px 0;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.player-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;font-weight:700}.player select{margin-right:auto;border:1px solid var(--line);background:white;border-radius:9px;padding:7px;max-width:190px;font:12px Cairo;color:var(--ink)}audio{width:100%;height:38px}.status{font-size:11px;color:var(--muted);margin-top:7px;min-height:18px}.progress{height:4px;background:var(--mint);border-radius:8px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}.reader{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(17px,4vw,36px);box-shadow:var(--shadow)}.bismillah{text-align:center;font:30px 'Amiri Quran',serif;color:var(--green);margin:0 0 20px}.verses{font:clamp(24px,4vw,33px)/2.35 'Amiri Quran',serif;text-align:justify}.verse{cursor:pointer;border-radius:7px;padding:2px}.verse:focus,.verse.active{background:var(--mint);outline:none}.num{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;border:1px solid #b8c7a8;border-radius:50%;font:12px Cairo;color:#71895e;margin:0 5px;vertical-align:middle}.bottom{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.bottom .btn{flex:1;min-width:125px}.empty{text-align:center;padding:35px;color:var(--muted)}dialog{border:0;border-radius:18px;max-width:min(520px,calc(100% - 25px));width:100%;padding:22px;background:var(--card);color:var(--ink);box-shadow:0 20px 80px #0003}dialog::backdrop{background:#17271dcc}.dialog-text{font:24px/2 'Amiri Quran',serif;margin:15px 0}.dialog-actions{display:flex;gap:8px;flex-wrap:wrap}.dialog-actions .btn{flex:1}.tafsir{font-size:13px;line-height:2;color:var(--muted);background:var(--mint);padding:12px;border-radius:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#244b37;color:white;padding:10px 16px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:600px){.wrap{width:min(100% - 20px,980px);padding-top:12px}.hero{padding:20px 13px;border-radius:17px}.hero h1{font-size:34px}.reader{padding:17px 14px}.verses{line-height:2.25;text-align:right}.player{padding:12px}.player-row{flex-wrap:wrap}.player select{max-width:145px}.top .btn{padding:8px 10px}.bottom{position:sticky;bottom:8px;background:#f5f4ecee;padding:7px 0;backdrop-filter:blur(10px)}}
</style></head>
<body><main class="wrap"><header class="top"><div class="brand">✦ يومك</div><button class="btn" id="back">رجوع</button></header>
<section class="hero"><small>القرآن الكريم</small><h1 id="title">سورة الفاتحة</h1><div class="meta" id="meta">مكية · ٧ آيات</div><div class="tools"><button class="btn" id="fontDown">تصغير الخط</button><button class="btn" id="fontUp">تكبير الخط</button><button class="btn" id="share">مشاركة السورة</button></div></section>
<section class="player"><div class="player-row"><span>▶ التلاوة الصوتية</span><select id="reciter" aria-label="اختيار القارئ"><option value="ar.alafasy">مشاري العفاسي</option><option value="ar.husary">محمود خليل الحصري</option><option value="ar.minshawi">محمد صديق المنشاوي</option><option value="ar.abdulbasit">عبدالباسط عبدالصمد</option></select></div><audio id="audio" controls preload="none"></audio><div class="status" id="audioStatus">اضغط تشغيل للاستماع للسورة.</div><div class="progress"><span id="progress"></span></div></section>
<section class="reader"><p class="bismillah" id="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p><div class="verses" id="verses"><div class="empty">جارٍ تحميل السورة...</div></div><div class="bottom"><button class="btn" id="prev">السورة السابقة</button><button class="btn" id="bookmarks">الآيات المحفوظة</button><button class="btn" id="next">السورة التالية</button></div></section></main>
<dialog id="ayahDialog"><h3 id="dialogTitle">الآية</h3><div class="dialog-text" id="dialogVerse"></div><div class="tafsir" id="tafsir">جارٍ تحميل التفسير الميسر...</div><div class="dialog-actions" style="margin-top:14px"><button class="btn" id="playAyah">استمع للآية</button><button class="btn" id="saveAyah">احفظ الآية</button><button class="btn" id="copyAyah">نسخ</button><button class="btn" id="closeDialog">إغلاق</button></div></dialog><div class="toast" id="toast"></div>
<script>
const info=[['الفاتحة',7,'مكية'],['البقرة',286,'مدنية'],['آل عمران',200,'مدنية'],['النساء',176,'مدنية'],['المائدة',120,'مدنية'],['الأنعام',165,'مكية'],['الأعراف',206,'مكية'],['الأنفال',75,'مدنية'],['التوبة',129,'مدنية'],['يونس',109,'مكية'],['هود',123,'مكية'],['يوسف',111,'مكية'],['الرعد',43,'مدنية'],['إبراهيم',52,'مكية'],['الحجر',99,'مكية'],['النحل',128,'مكية'],['الإسراء',111,'مكية'],['الكهف',110,'مكية'],['مريم',98,'مكية'],['طه',135,'مكية'],['الأنبياء',112,'مكية'],['الحج',78,'مدنية'],['المؤمنون',118,'مكية'],['النور',64,'مدنية'],['الفرقان',77,'مكية'],['الشعراء',227,'مكية'],['النمل',93,'مكية'],['القصص',88,'مكية'],['العنكبوت',69,'مكية'],['الروم',60,'مكية'],['لقمان',34,'مكية'],['السجدة',30,'مكية'],['الأحزاب',73,'مدنية'],['سبأ',54,'مكية'],['فاطر',45,'مكية'],['يس',83,'مكية'],['الصافات',182,'مكية'],['ص',88,'مكية'],['الزمر',75,'مكية'],['غافر',85,'مكية'],['فصلت',54,'مكية'],['الشورى',53,'مكية'],['الزخرف',89,'مكية'],['الدخان',59,'مكية'],['الجاثية',37,'مكية'],['الأحقاف',35,'مكية'],['محمد',38,'مدنية'],['الفتح',29,'مدنية'],['الحجرات',18,'مدنية'],['ق',45,'مكية'],['الذاريات',60,'مكية'],['الطور',49,'مكية'],['النجم',62,'مكية'],['القمر',55,'مكية'],['الرحمن',78,'مدنية'],['الواقعة',96,'مكية'],['الحديد',29,'مدنية'],['المجادلة',22,'مدنية'],['الحشر',24,'مدنية'],['الممتحنة',13,'مدنية'],['الصف',14,'مدنية'],['الجمعة',11,'مدنية'],['المنافقون',11,'مدنية'],['التغابن',18,'مدنية'],['الطلاق',12,'مدنية'],['التحريم',12,'مدنية'],['الملك',30,'مكية'],['القلم',52,'مكية'],['الحاقة',52,'مكية'],['المعارج',44,'مكية'],['نوح',28,'مكية'],['الجن',28,'مكية'],['المزمل',20,'مكية'],['المدثر',56,'مكية'],['القيامة',40,'مكية'],['الإنسان',31,'مدنية'],['المرسلات',50,'مكية'],['النبأ',40,'مكية'],['النازعات',46,'مكية'],['عبس',42,'مكية'],['التكوير',29,'مكية'],['الانفطار',19,'مكية'],['المطففين',36,'مكية'],['الانشقاق',25,'مكية'],['البروج',22,'مكية'],['الطارق',17,'مكية'],['الأعلى',19,'مكية'],['الغاشية',26,'مكية'],['الفجر',30,'مكية'],['البلد',20,'مكية'],['الشمس',15,'مكية'],['الليل',21,'مكية'],['الضحى',11,'مكية'],['الشرح',8,'مكية'],['التين',8,'مكية'],['العلق',19,'مكية'],['القدر',5,'مكية'],['البينة',8,'مدنية'],['الزلزلة',8,'مدنية'],['العاديات',11,'مكية'],['القارعة',11,'مكية'],['التكاثر',8,'مكية'],['العصر',3,'مكية'],['الهمزة',9,'مكية'],['الفيل',5,'مكية'],['قريش',4,'مكية'],['الماعون',7,'مكية'],['الكوثر',3,'مكية'],['الكافرون',6,'مكية'],['النصر',3,'مدنية'],['المسد',5,'مكية'],['الإخلاص',4,'مكية'],['الفلق',5,'مكية'],['الناس',6,'مكية']];
const $=s=>document.querySelector(s), params=new URLSearchParams(location.search);let number=Math.max(1,Math.min(114,Number(params.get('surah'))||1)), verses=[],activeAyah=1,fontSize=29,recitation=[],playingIndex=0;
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
async function json(url){const r=await fetch(url);if(!r.ok)throw Error('network');const d=await r.json();if(d.code!==200)throw Error('api');return d.data}
async function load(){const textData=await json(`https://api.alquran.cloud/v1/surah/${number}/quran-uthmani`);verses=textData.ayahs;$('#title').textContent='سورة '+info[number-1][0];$('#meta').textContent=info[number-1][2]+' · '+info[number-1][1]+' آية';$('#bismillah').hidden=number===1||number===9;render();loadRecitation(false)}
function render(){const box=$('#verses');box.style.fontSize=fontSize+'px';box.replaceChildren();verses.forEach((v,i)=>{const span=document.createElement('span');span.className='verse';span.tabIndex=0;span.dataset.ayah=i+1;span.textContent=v.text+' ';const n=document.createElement('span');n.className='num';n.textContent=(i+1).toLocaleString('ar-EG');span.append(n);span.addEventListener('click',()=>openAyah(i+1));box.append(span,document.createTextNode(' '))})}
function loadRecitation(){const edition=$('#reciter').value;const folders={'ar.alafasy':'Alafasy_128kbps','ar.husary':'Husary_128kbps','ar.minshawi':'Minshawy_Murattal_128kbps','ar.abdulbasit':'Abdul_Basit_Murattal_128kbps'};const folder=folders[edition]||folders['ar.alafasy'];recitation=verses.map(v=>({audio:`https://everyayah.com/data/${folder}/${String(number).padStart(3,'0')}${String(v.numberInSurah).padStart(3,'0')}.mp3`}));playingIndex=0;const a=$('#audio');a.pause();a.removeAttribute('src');a.load();$('#audioStatus').textContent='اضغط على آية للاستماع أو تشغيل السورة.'}
async function playAyahAudio(ayah){const item=recitation[ayah-1];if(!item?.audio){toast('التلاوة غير متاحة حاليا');return}playingIndex=ayah-1;const a=$('#audio');a.pause();a.src=item.audio;a.load();$('#audioStatus').textContent=`جارٍ تحميل الآية ${ayah}...`;try{await a.play();$('#audioStatus').textContent=`تلاوة الآية ${ayah} من ${verses.length}`}catch(e){$('#audioStatus').textContent='لم يبدأ الصوت. تأكد من اتصال الإنترنت ثم اضغط تشغيل مرة أخرى.';toast('تعذّر تشغيل التلاوة؛ جرّب تغيير القارئ أو إعادة المحاولة.')}}

$('#audio').addEventListener('ended',()=>{if(playingIndex+1<recitation.length)playAyahAudio(playingIndex+2);else $('#audioStatus').textContent='انتهت السورة.'});$('#audio').addEventListener('error',()=>{$('#audioStatus').textContent='تعذّر تحميل ملف الآية من مصدر الصوت. جرّب قارئًا آخر أو أعد المحاولة.';});$('#audio').addEventListener('timeupdate',()=>{$('#progress').style.width=($('#audio').duration?$('#audio').currentTime/$('#audio').duration*100:0)+'%'});
async function openAyah(n){activeAyah=n;const v=verses[n-1];$('#dialogTitle').textContent=`سورة ${info[number-1][0]} · الآية ${n}`;$('#dialogVerse').textContent=v.text;$('#tafsir').textContent='جارٍ تحميل التفسير الميسر...';$('#ayahDialog').showModal();try{const d=await json(`https://api.alquran.cloud/v1/ayah/${number}:${n}/ar.muyassar`);$('#tafsir').textContent=d.text}catch{$('#tafsir').textContent='التفسير يحتاج اتصالا بالإنترنت.'}}
$('#reciter').addEventListener('change',loadRecitation);$('#fontUp').onclick=()=>{fontSize=Math.min(43,fontSize+2);render()};$('#fontDown').onclick=()=>{fontSize=Math.max(21,fontSize-2);render()};$('#playAyah').onclick=()=>playAyahAudio(activeAyah);$('#closeDialog').onclick=()=>$('#ayahDialog').close();$('#saveAyah').onclick=()=>{const key='yawmak-quran-bookmarks';const list=JSON.parse(localStorage.getItem(key)||'[]');const ref=`${number}:${activeAyah}`;const next=list.includes(ref)?list.filter(x=>x!==ref):[...list,ref];localStorage.setItem(key,JSON.stringify(next));toast(next.includes(ref)?'تم حفظ الآية':'تم حذف الآية من المحفوظات')};$('#copyAyah').onclick=async()=>{const text=verses[activeAyah-1].text+`\n[سورة ${info[number-1][0]}: ${activeAyah}]`;try{await navigator.clipboard.writeText(text);toast('تم نسخ الآية')}catch{toast('النسخ غير متاح في المتصفح')}};$('#bookmarks').onclick=()=>{const list=JSON.parse(localStorage.getItem('yawmak-quran-bookmarks')||'[]');toast(list.length?`لديك ${list.length} آية محفوظة`:'لا توجد آيات محفوظة بعد')};$('#share').onclick=async()=>{const url=location.href;try{if(navigator.share)await navigator.share({title:$('#title').textContent,url});else{await navigator.clipboard.writeText(url);toast('تم نسخ رابط السورة')}}catch{}};$('#prev').onclick=()=>{if(number>1)location.href=`?surah=${number-1}`};$('#next').onclick=()=>{if(number<114)location.href=`?surah=${number+1}`};$('#back').onclick=()=>history.length>1?history.back():location.href='./index.html';load().catch(()=>{$('#verses').innerHTML='<div class="empty">تعذّر تحميل السورة. تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.</div>'});
</script></body></html>
