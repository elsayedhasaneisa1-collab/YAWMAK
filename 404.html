<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7f1">
    <meta name="robots" content="noindex, follow">
    <title>الصفحة غير موجودة | YAWMAK</title>
    <link rel="stylesheet" href="./styles.css">

    <style>
        :root {
            --page-bg: #f5f7f1;
            --card-bg: #ffffff;
            --green: #527b58;
            --green-dark: #315b3c;
            --green-light: #e8f0e5;
            --text: #263b2c;
            --muted: #7c8b7d;
            --border: #e5ebe1;
            --shadow: 0 25px 80px rgba(49, 91, 60, .09);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 15%, rgba(151, 184, 137, .13), transparent 30%),
                radial-gradient(circle at 85% 85%, rgba(151, 184, 137, .12), transparent 32%),
                var(--page-bg);
            color: var(--text);
            font-family: var(--font, "Cairo"), Tahoma, Arial, sans-serif;
        }

        .error-page {
            position: relative;
            width: min(100%, 510px);
            min-height: 650px;
            padding: 30px 25px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid rgba(82, 123, 88, .10);
            border-radius: 32px;
            box-shadow: var(--shadow);
            isolation: isolate;
        }

        .error-page::before,
        .error-page::after {
            content: "";
            position: absolute;
            z-index: -1;
            border-radius: 50%;
            pointer-events: none;
        }

        .error-page::before {
            width: 260px;
            height: 260px;
            top: -150px;
            right: -100px;
            background: rgba(151, 184, 137, .12);
        }

        .error-page::after {
            width: 220px;
            height: 220px;
            bottom: -130px;
            left: -100px;
            background: rgba(151, 184, 137, .10);
        }

        .brand {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: var(--green-light);
        }

        .brand-icon svg {
            width: 27px;
            height: 27px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: .5px;
            color: var(--green-dark);
        }

        .visual {
            position: relative;
            width: 250px;
            height: 250px;
            display: grid;
            place-items: center;
            margin: 10px auto 0;
        }

        .visual-halo {
            position: absolute;
            width: 205px;
            height: 205px;
            border-radius: 50%;
            background: radial-gradient(circle, #e9f2e6 0%, #f3f7ef 60%, transparent 72%);
        }

        .visual-ring {
            position: absolute;
            width: 235px;
            height: 235px;
            border: 1px dashed rgba(82, 123, 88, .30);
            border-radius: 50%;
            animation: rotate 30s linear infinite;
        }

        .visual-ring::before,
        .visual-ring::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #8eaf83;
        }

        .visual-ring::before {
            top: 32px;
            right: 32px;
        }

        .visual-ring::after {
            bottom: 35px;
            left: 25px;
            width: 8px;
            height: 8px;
            background: #c3d4b9;
        }

        .main-icon {
            position: relative;
            width: 150px;
            height: 150px;
            display: grid;
            place-items: center;
            border-radius: 42px;
            background: linear-gradient(145deg, #ffffff, #e8f1e5);
            border: 1px solid #dce8d8;
            box-shadow: 0 18px 45px rgba(49, 91, 60, .13);
            animation: float 4s ease-in-out infinite;
        }

        .main-icon svg {
            width: 110px;
            height: 110px;
            overflow: visible;
        }

        .clock-hand {
            transform-box: view-box;
            transform-origin: 80px 80px;
        }

        .number {
            margin-top: 2px;
            color: var(--green);
            font-size: 76px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: 5px;
            direction: ltr;
            opacity: .13;
        }

        .content {
            width: 100%;
            text-align: center;
            margin-top: -7px;
        }

        h1 {
            margin: 0 0 13px;
            color: var(--green-dark);
            font-size: 27px;
            font-weight: 900;
        }

        .description {
            max-width: 340px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 14px;
            line-height: 2;
        }

        .actions {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 27px;
        }

        .btn {
            min-width: 145px;
            min-height: 49px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 12px 20px;
            border: 1px solid transparent;
            border-radius: 15px;
            font: inherit;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-primary {
            color: #fff;
            background: linear-gradient(135deg, #648c66, #3d6948);
            box-shadow: 0 8px 20px rgba(61, 105, 72, .20);
        }

        .btn-primary:hover {
            box-shadow: 0 12px 25px rgba(61, 105, 72, .27);
        }

        .btn-secondary {
            color: var(--green-dark);
            background: #f5f8f2;
            border-color: var(--border);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .footer {
            width: 100%;
            margin-top: auto;
            padding-top: 24px;
            color: #9aa79a;
            font-size: 11px;
            text-align: center;
        }

        .footer span {
            color: var(--green);
            font-weight: 800;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(-2deg);
            }
            50% {
                transform: translateY(-10px) rotate(2deg);
            }
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        @media (min-width: 768px) {
            body {
                padding: 40px;
            }

            .error-page {
                width: min(100%, 1050px);
                min-height: 590px;
                padding: 42px 70px;
                display: grid;
                grid-template-columns: 1fr 1.1fr;
                grid-template-rows: auto 1fr auto;
                column-gap: 65px;
                row-gap: 10px;
                align-items: center;
                border-radius: 38px;
            }

            .brand {
                grid-column: 1 / -1;
                grid-row: 1;
                justify-content: flex-start;
                margin: 0;
            }

            .visual {
                grid-column: 1;
                grid-row: 2;
                width: 100%;
                height: 330px;
                margin: 0;
            }

            .visual-halo {
                width: 270px;
                height: 270px;
            }

            .visual-ring {
                width: 310px;
                height: 310px;
            }

            .main-icon {
                width: 190px;
                height: 190px;
                border-radius: 52px;
            }

            .main-icon svg {
                width: 135px;
                height: 135px;
            }

            .content {
                grid-column: 2;
                grid-row: 2;
                margin: 0;
                text-align: right;
                align-self: center;
            }

            .number {
                margin: 0 0 12px;
                font-size: 100px;
                text-align: right;
            }

            h1 {
                margin-bottom: 17px;
                font-size: 35px;
            }

            .description {
                max-width: 430px;
                margin: 0;
                font-size: 16px;
                line-height: 2.2;
            }

            .actions {
                justify-content: flex-start;
                margin-top: 32px;
            }

            .btn {
                min-width: 155px;
                min-height: 53px;
            }

            .footer {
                grid-column: 1 / -1;
                grid-row: 3;
                padding-top: 20px;
                border-top: 1px solid var(--border);
            }
        }

        @media (min-width: 1100px) {
            .error-page {
                min-height: 630px;
                padding: 48px 85px 30px;
                column-gap: 90px;
            }

            .visual {
                transform: scale(1.08);
            }

            .number {
                font-size: 115px;
            }

            h1 {
                font-size: 39px;
            }

            .description {
                font-size: 17px;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            .error-page {
                min-height: 620px;
                padding: 25px 17px 20px;
                border-radius: 25px;
            }

            .visual {
                transform: scale(.88);
                margin-top: -5px;
                margin-bottom: -8px;
            }

            h1 {
                font-size: 24px;
            }

            .actions {
                gap: 8px;
            }

            .btn {
                min-width: 0;
                flex: 1;
                padding: 11px 10px;
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="error-page">

        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 48 48" fill="none">
                    <path d="M24 5C13.5 5 5 13.5 5 24s8.5 19 19 19 19-8.5 19-19S34.5 5 24 5Z" stroke="#527b58" stroke-width="3"/>
                    <path d="M24 12v12l8 5" stroke="#527b58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M32 8c-1 5-5 8-10 9 1-5 4-8 10-9Z" fill="#8eaf83"/>
                </svg>
            </div>
            <div class="brand-name">YAWMAK</div>
        </div>

        <div class="visual">
            <div class="visual-halo"></div>
            <div class="visual-ring"></div>

            <div class="main-icon">
                <svg viewBox="0 0 160 160" fill="none">
                    <circle cx="80" cy="80" r="61" stroke="#b9cfb1" stroke-width="7"/>
                    <circle cx="80" cy="80" r="49" fill="#f7faf4"/>

                    <g stroke="#8eaf83" stroke-width="3" stroke-linecap="round">
                        <path d="M80 39v6"/>
                        <path d="M80 115v6"/>
                        <path d="M39 80h6"/>
                        <path d="M115 80h6"/>
                    </g>

                    <path id="clock-hour" class="clock-hand" d="M80 80V55" stroke="#315b3c" stroke-width="6" stroke-linecap="round"/>
                    <path id="clock-minute" class="clock-hand" d="M80 80V44" stroke="#527b58" stroke-width="4" stroke-linecap="round"/>
                    <path id="clock-second" class="clock-hand" d="M80 87V37" stroke="#91b488" stroke-width="2" stroke-linecap="round"/>

                    <circle cx="80" cy="80" r="6" fill="#527b58"/>

                    <path d="M112 32c-3 14-13 22-29 25 3-15 12-23 29-25Z" fill="#91b488"/>
                    <path d="M83 57c8-10 17-18 29-25" stroke="#527b58" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
        </div>

        <section class="content">
            <div class="number">404</div>
            <h1>الصفحة مش موجودة</h1>
            <p class="description">
                يبدو إن الصفحة اللي بتدور عليها مش موجودة أو اتنقلت لمكان تاني.
                ارجع ليومك وكمل رحلتك بهدوء.
            </p>

            <div class="actions">
                <a href="./index.html" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1V10Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    الصفحة الرئيسية
                </a>

                <button type="button" class="btn btn-secondary" onclick="history.back()">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M19 12H5m7-7-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    رجوع
                </button>
            </div>
        </section>

        <footer class="footer">
            مساحة صغيرة ليوم أخف · <span>YAWMAK</span>
        </footer>

    </main>

    <script>
        const hourHand = document.getElementById("clock-hour");
        const minuteHand = document.getElementById("clock-minute");
        const secondHand = document.getElementById("clock-second");

        function update404Clock() {
            const now = new Date();

            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            const hourAngle = hours * 30 + minutes * 0.5;
            const minuteAngle = minutes * 6 + seconds * 0.1;
            const secondAngle = (seconds + milliseconds / 1000) * 6;

            hourHand.setAttribute(
                "transform",
                `rotate(${hourAngle} 80 80)`
            );

            minuteHand.setAttribute(
                "transform",
                `rotate(${minuteAngle} 80 80)`
            );

            secondHand.setAttribute(
                "transform",
                `rotate(${secondAngle} 80 80)`
            );
        }

        update404Clock();
        setInterval(update404Clock, 100);
    </script>

</body>
</html>
